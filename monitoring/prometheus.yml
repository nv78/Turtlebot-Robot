global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "navy_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Navy Autonomous application metrics
  - job_name: 'navy-autonomous'
    static_configs:
      - targets: ['navy-autonomous:8080']
    scrape_interval: 5s
    metrics_path: /metrics
    
  # ROS system metrics
  - job_name: 'ros-metrics'
    static_configs:
      - targets: ['navy-autonomous:11311']
    scrape_interval: 10s
    metrics_path: /ros_metrics

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-exporter:9323']

  # Custom YOLO performance metrics
  - job_name: 'yolo-metrics'
    static_configs:
      - targets: ['navy-autonomous:8081']
    scrape_interval: 30s
    metrics_path: /yolo_metrics 