apiVersion: apps/v1
kind: Deployment
metadata:
  name: navy-autonomous
  namespace: navy-autonomous
  labels:
    app: navy-autonomous
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navy-autonomous
  template:
    metadata:
      labels:
        app: navy-autonomous
        version: v1
    spec:
      serviceAccountName: navy-autonomous
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: navy-autonomous
        image: ghcr.io/your-org/navy-autonomous:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11311
          name: ros-master
          protocol: TCP
        - containerPort: 11312
          name: ros-param
          protocol: TCP
        env:
        - name: NAVY_MODE
          valueFrom:
            configMapKeyRef:
              name: navy-autonomous-config
              key: mode
        - name: ROS_MASTER_URI
          value: "http://localhost:11311"
        - name: ROS_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: TURTLEBOT3_MODEL
          value: "waffle_pi"
        - name: ENABLE_HEALTH_MONITORING
          value: "true"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /healthcheck.sh
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /healthcheck.sh
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 2
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        - name: logs-volume
          mountPath: /var/log/navy-autonomous
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: navy-autonomous-config
      - name: logs-volume
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: navy-autonomous-service
  namespace: navy-autonomous
  labels:
    app: navy-autonomous
spec:
  type: ClusterIP
  ports:
  - port: 11311
    targetPort: 11311
    protocol: TCP
    name: ros-master
  - port: 11312
    targetPort: 11312
    protocol: TCP
    name: ros-param
  selector:
    app: navy-autonomous

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: navy-autonomous-config
  namespace: navy-autonomous
data:
  mode: "semi_autonomous"
  log_level: "INFO"
  yolo_weights: "yolov3-tiny.weights"
  detection_threshold: "0.3"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: navy-autonomous
  namespace: navy-autonomous

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: navy-autonomous
  name: navy-autonomous-role
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: navy-autonomous-rolebinding
  namespace: navy-autonomous
subjects:
- kind: ServiceAccount
  name: navy-autonomous
  namespace: navy-autonomous
roleRef:
  kind: Role
  name: navy-autonomous-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Namespace
metadata:
  name: navy-autonomous
  labels:
    name: navy-autonomous 