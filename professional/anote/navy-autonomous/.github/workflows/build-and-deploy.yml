# Navy Autonomous Robot - CI/CD Pipeline
# Automated build, test, and deployment workflow for the autonomous TurtleBot system
# Supports multi-environment deployment with comprehensive testing and security scanning

name: Build and Deploy Navy Autonomous

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Global environment variables for container registry
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Automated testing job
  # Validates ROS workspace build and runs unit tests
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distro: [noetic]
        
    steps:
    - uses: actions/checkout@v4
    
    # Setup ROS environment for testing
    - name: Setup ROS environment
      uses: ros-tooling/setup-ros@v0.6
      with:
        required-ros-distributions: ${{ matrix.ros_distro }}
    
    # Install system dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-catkin-tools python3-rosdep
        sudo rosdep init
        rosdep update
    
    # Build the ROS workspace
    - name: Build workspace
      run: |
        cd catkin_ws
        rosdep install --from-paths src --ignore-src -r -y
        catkin build --cmake-args -DCMAKE_BUILD_TYPE=Release
    
    # Execute ROS tests
    - name: Run tests
      run: |
        cd catkin_ws
        source devel/setup.bash
        catkin run_tests
        catkin_test_results

  # Docker image build job
  # Creates production-ready container images
  build-docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deployment/production/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  # Staging deployment job
  # Deploys to the staging environment
  deploy-staging:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        ./scripts/deployment/deploy.sh staging ${{ github.sha }}

  # Production deployment job
  # Deploys to the production environment
  deploy-production:
    needs: build-docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        ./scripts/deployment/deploy.sh production ${{ github.sha }}

  # Security scanning job
  # Runs Trivy vulnerability scanner and uploads results
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif' 